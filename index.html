<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LogTailer</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <div id="drop-zone" class="drop-zone active">
      <div class="drop-content">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="drop-icon"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
        <h2>Drop a log file here to start tailing</h2>
        <p>Supports live updates and drag & drop</p>
      </div>
    </div>
    
    <div id="log-container" class="log-container hidden">
      <div class="log-header">
        <div class="log-status">
          <span class="status-indicator"></span>
          <span id="current-file">Tailing...</span>
        </div>
        <button id="close-file-btn" class="close-btn">Close File</button>
      </div>
      <div id="log-output" class="log-output"></div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
